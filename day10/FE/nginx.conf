server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — mọi route trả index.html (react-router xử lý phía client).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset có hash
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
